name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소합니다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Lint · FSD · Typecheck · Test · Build · Size · E2E · Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager를 따릅니다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:fsd
      - run: pnpm typecheck
      - run: pnpm test
      # 사이트와 Storybook(dist/storybook)을 함께 빌드합니다.
      - run: pnpm build:all
      - run: pnpm size
      # 프로덕션 빌드를 띄워 화면 폭별 넘침, 접근성(axe), 키보드, 편집 흐름을 검사합니다.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # 접근성·권장사항·SEO 점수와 레이아웃 이동을 지키고, 성능·용량은 경고로 알립니다.
      - run: pnpm lhci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            lhci-report/
          retention-days: 7
